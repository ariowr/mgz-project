<!doctype html>
<html lang="id">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>MGZ Project – Parafrase Lagu Meggy Z</title>
  <style>
    :root {
      color-scheme: light dark;
      --bg: #ffffff;
      --fg: #1a1a1a;
      --muted: #555;
      --accent: #8a2be2;
      --border: #e5e5e5;
    }
    @media (prefers-color-scheme: dark) {
      :root {
        --bg: #121212;
        --fg: #eaeaea;
        --muted: #a0a0a0;
        --accent: #b388ff;
        --border: #2a2a2a;
      }
    }
    * { box-sizing: border-box; }
    body {
      margin: 0;
      background: var(--bg);
      color: var(--fg);
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif;
      line-height: 1.7;
    }
    main {
      max-width: 720px;
      margin: 0 auto;
      padding: 48px 24px 80px;
    }
    h1 {
      font-size: 2rem;
      margin-bottom: 0.25rem;
    }
    .subtitle {
      color: var(--muted);
      margin-top: 0;
      margin-bottom: 2rem;
    }
    ul.song-list {
      list-style: none;
      padding: 0;
      margin: 2rem 0;
    }
    ul.song-list li {
      border-bottom: 1px solid var(--border);
    }
    ul.song-list a {
      display: block;
      padding: 1rem 0.25rem;
      color: var(--fg);
      text-decoration: none;
      font-size: 1.1rem;
      transition: color 0.15s ease;
    }
    ul.song-list a:hover {
      color: var(--accent);
    }
    ul.song-list a::after {
      content: " →";
      color: var(--accent);
    }
    .header-img {
      display: block;
      width: 50%;
      max-width: 100%;
      height: auto;
      border-radius: 12px;
      margin: 0 auto 1.5rem;
    }
    footer {
      margin-top: 3rem;
      font-size: 0.85rem;
      color: var(--muted);
    }
  </style>
</head>
<body>
  <main>
    <img class="header-img" src="header.png" alt="Header MGZ Project" />
    <h1>MGZ Project</h1>
    <p class="subtitle">Parafrase &amp; pembahasan makna filosofi lagu-lagu Meggy Z</p>

    <ul class="song-list">
      <li><a href="jatuh-bangun.html">Jatuh Bangun</a></li>
      <li><a href="senyum-membawa-luka.html">Senyum Membawa Luka</a></li>
    </ul>

    <footer>Created by ariowr 2026</footer>
  </main>
</body>
</html>
